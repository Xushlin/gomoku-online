<div class="flex items-start gap-3">
  <!--
    The field. `aspect-ratio` plus a percentage width is what keeps it inside a
    375 px viewport without a media query: the grid scales, the cell count does not.
  -->
  <div
    class="bg-surface border-border rounded-card grid min-w-0 flex-1 gap-px border p-1"
    [style.grid-template-columns]="'repeat(' + columns + ', minmax(0, 1fr))'"
    [style.aspect-ratio]="columns + ' / ' + rows"
    aria-hidden="true"
  >
    @for (cell of cells(); track cell.key) {
      <div class="rounded-[2px]" [class]="cellClass(cell.state)"></div>
    }
  </div>

  <div class="flex w-16 shrink-0 flex-col gap-1 sm:w-20">
    <p class="text-muted text-xs">{{ 'tetris.next' | transloco }}</p>
    <div
      class="bg-surface border-border rounded-card grid aspect-square grid-cols-4 gap-px border p-1"
      aria-hidden="true"
    >
      @for (filled of previewCells(); track $index) {
        <div class="rounded-[2px]" [class]="filled ? 'bg-primary' : ''"></div>
      }
    </div>
  </div>
</div>
