<section
  class="panel text-text w-full max-w-sm border p-6"
>
  <h2 class="mb-2 text-lg font-semibold tracking-tight">
    {{ titleKey() | transloco }}
  </h2>
  <p class="text-muted mb-4 text-sm">
    {{ reasonKey() | transloco }}
  </p>
  <div class="flex flex-wrap justify-end gap-2">
    <button
      type="button"
      class="cell text-text hover:bg-bg border px-3 py-1.5 text-sm"
      (click)="stay()"
    >
      {{ 'game.ended.dismiss' | transloco }}
    </button>
    <button
      type="button"
      class="cell text-text hover:bg-bg border px-3 py-1.5 text-sm"
      (click)="viewReplay()"
    >
      {{ 'game.ended.view-replay' | transloco }}
    </button>
    <button
      type="button"
      class="control-primary text-on-primary px-3 py-1.5 text-sm font-semibold"
      (click)="backToLobby()"
    >
      {{ 'game.ended.back-to-lobby' | transloco }}
    </button>
  </div>
</section>
