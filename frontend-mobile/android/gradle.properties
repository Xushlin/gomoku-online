org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin 增量编译在本项目的 Android 构建上关不掉自己的缓存文件,任务直接失败:
#
#   :shared_preferences_android:compileDebugKotlin
#   Could not close incremental caches in ...\caches-jvm\jvm\kotlin:
#   class-fq-name-to-source.tab, source-to-classes.tab, internal-name-to-source.tab
#
# **不是陈旧缓存**:全量 `flutter clean` + 删掉 build/ 之后一模一样地复现。
# **也不是编译器 daemon 持有句柄**:换成 `kotlin.compiler.execution.strategy=in-process`
# 仍然失败 —— 那次失败同时也再证明了一遍「clean 本身不解决」。
# 四次构建,单变量:脏树失败 / clean 失败 / clean+本行成功 / clean+in-process 失败。
#
# 代价是 Android 的 Kotlin 增量重编译没了。这里付得起:Android 不在 CI 里,
# 而这个构建是手动、少量地跑的 —— 而没有这一行它**一次都跑不成**。
#
# 拆除条件:升级 Kotlin / AGP / Flutter 之后,删掉本行做一次 clean 构建;能过就删。
kotlin.incremental=false
