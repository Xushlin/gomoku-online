distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
# NOTE: leave this pointing at services.gradle.org.
#
# Switching it to a mirror looked like an obvious speed-up and was the opposite:
# the wrapper caches by a hash OF THE URL, so a different URL is a cache MISS and
# re-downloads all 234 MB from scratch. Measured -- the original distribution was
# already unpacked in ~/.gradle/wrapper/dists with its .ok marker, and the mirrored
# URL spent 445s and died on `Premature EOF`.
#
# The mirrors that do help are the Maven ones in settings.gradle.kts /
# build.gradle.kts: those cover dependency resolution, which is a separate and
# genuinely slow phase.
distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-all.zip
